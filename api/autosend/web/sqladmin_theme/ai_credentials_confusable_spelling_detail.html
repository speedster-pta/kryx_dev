{% extends "sqladmin/layout.html" %}

{% block head %}{{ super() }}
<style>

  .form-card-container {
    background-color: var(--color-white);
    border: 1px solid var(--slate-200);
    color: var(--slate-900);
  }
  html.dark .form-card-container,
  [data-bs-theme="dark"] .form-card-container {
    background-color: var(--slate-800) !important;
    border-color: var(--slate-700) !important;
    color: var(--slate-100) !important;
  }

  .section-title { color: var(--slate-600); }
  html.dark .section-title,
  [data-bs-theme="dark"] .section-title { color: var(--slate-300) !important; }

  .field-input {
    width: 100%; padding: 0.5rem 0.75rem; border-radius: 0.5rem;
    border: 1px solid var(--slate-300); background-color: var(--color-white); color: var(--slate-900); font-size: 0.85rem;
  }
  html.dark .field-input,
  [data-bs-theme="dark"] .field-input {
    background-color: var(--slate-900) !important; border-color: var(--slate-700) !important; color: var(--slate-100) !important;
  }

  .btn-primary-sm {
    padding: 0.35rem 0.85rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600;
    background-color: var(--brand-primary); color: var(--color-white);
  }

  .btn-danger-sm {
    padding: 0.35rem 0.85rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600;
    background-color: var(--color-white); color: #dc2626; border: 1px solid #dc2626;
  }
  .btn-danger-sm:hover { background-color: #fef2f2; }
</style>
{% endblock %}

{% block content %}
<div class="w-full max-w-3xl mx-auto space-y-6">

  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-700 pb-5 border-l-4 pl-4 border-brand-accent">
    <div>
      <a href="/ai-credentials?tab=voice-transcription" class="text-xs text-slate-500 hover:text-brand-primary"><i class="fa-solid fa-arrow-left mr-1"></i>AI Credentials</a>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mt-1">{{ spelling.language_code }} &rarr; {{ spelling.confusable_name }}</h1>
    </div>
  </div>

  <div class="form-card-container rounded-xl shadow-sm border-t-2 p-6"
       style="border-top-width: 2px !important; border-top-color: var(--brand-primary) !important;">
    {% if error %}
    <p class="text-sm text-red-600 dark:text-red-400 mb-3">{{ error }}</p>
    {% endif %}
    <h2 class="section-title text-sm font-semibold uppercase tracking-wide mb-4">Correction</h2>
    <form method="post" action="/ai-credentials/confusable-spellings/{{ spelling.id }}/update" class="space-y-3 max-w-md">
      <div>
        <label class="text-xs font-semibold text-slate-500">Language</label>
        <select name="language_code" class="field-input mt-1" required>
          {% for code, label in language_choices %}
          <option value="{{ code }}"{% if spelling.language_code == code %} selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500">Confusable Language Name</label>
        <input type="text" name="confusable_name" value="{{ spelling.confusable_name }}" class="field-input mt-1" required>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500">Patterns</label>
        <textarea name="patterns" rows="8" class="field-input mt-1" style="font-family: monospace;" required>{{ spelling.patterns }}</textarea>
      </div>
      <button type="submit" class="btn-primary-sm mt-2">Save</button>
    </form>
  </div>

  <form method="post" action="/ai-credentials/confusable-spellings/{{ spelling.id }}/delete"
        onsubmit="return confirm('Delete this confusable-spelling correction?');">
    <button type="submit" class="btn-danger-sm">Delete Correction</button>
  </form>

</div>
{% endblock %}
