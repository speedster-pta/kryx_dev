<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100 dark:bg-slate-900">
<head>
    <script>
    (function() {
      function applySystemTheme(e) {
        const isDark = e ? e.matches : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-bs-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      }

      // Apply system theme immediately
      applySystemTheme();

      // Listen for OS theme changes in real time
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
    })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryx login</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS & Custom App Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>

    <style>
      :root {
        --brand-primary: #06B6D4;
        --brand-primary-rgb: 6, 182, 212;
        --brand-primary-hover: #0891B2;
        --brand-secondary: #8f8f8f;
      }
      .bg-brand-primary { background-color: var(--brand-primary); }
      .bg-brand-primary:hover { background-color: var(--brand-primary-hover); }
      .text-brand-primary { color: var(--brand-primary); }
      .border-brand-primary { border-color: var(--brand-primary); }
      .shadow-brand { box-shadow: 0 10px 15px -3px rgba(var(--brand-primary-rgb), 0.25); }
      
      /* Custom Focus Ring styling */
      .focus-brand:focus {
        outline: none;
        border-color: var(--brand-primary) !important;
        box-shadow: 0 0 0 3px rgba(var(--brand-primary-rgb), 0.25) !important;
      }
    </style>
</head>

<body class="h-full flex flex-col items-center justify-center p-4 text-slate-800 dark:text-slate-100 font-sans antialiased bg-slate-100 dark:bg-slate-900 transition-colors duration-200">

    <main class="w-full max-w-md space-y-6">

        <!-- Brand Header Section -->
        <section class="text-center space-y-3">
            <img
                src="/static/logo_web.png"
                alt="Shofar"
                class="h-52 w-auto mx-auto drop-shadow-sm">

            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
                WhatsApp Manager
            </h1>

            <p class="text-xs text-slate-500 dark:text-slate-400">
                Secure WhatsApp messaging for Shofar teams.
            </p>
        </section>

        <!-- Login Card Panel -->
        <section class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm border-t-4" style="border-top-color: var(--brand-primary);">

            <form class="space-y-5" method="post" action="{{ url_for('admin:login') }}">

                <div class="border-b border-slate-100 dark:border-slate-700/60 pb-3 flex items-center justify-between">
                    <h2 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-lock text-brand-primary"></i> Welcome Back
                    </h2>
                </div>

                <!-- Error Alert Block -->
                {% if error %}
                <div class="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/60 text-rose-700 dark:text-rose-300 p-3 rounded-lg text-xs flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation shrink-0"></i>
                    <div>{{ error }}</div>
                </div>
                {% endif %}

                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">
                        Username
                    </label>
                    <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        autofocus
                        required
                        class="focus-brand w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">
                        Password
                    </label>

                    <div class="relative">
                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            class="focus-brand w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg pl-3 pr-16 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">

                        <button
                            type="button"
                            class="absolute right-2 top-1/2 -translate-y-1/2 px-2.5 py-1 text-xs font-semibold text-slate-500 hover:text-brand-primary dark:text-slate-400 dark:hover:text-brand-primary transition"
                            onclick="togglePasswordVisibility(this)">
                            Show
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full bg-brand-primary text-white font-semibold py-3 px-4 rounded-xl transition duration-150 flex items-center justify-center gap-2 shadow-brand active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-offset-2" 
                    style="--tw-ring-color: var(--brand-primary);">
                    Sign In <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>

                <!-- Support Footer inside Card -->
                <div class="pt-2 text-center text-xs text-slate-500 dark:text-slate-400">
                    Contact <a href="https://wa.me/+27832916327" target="_blank" class="text-brand-primary hover:underline font-medium">Phillip</a> for new accounts and support,
                    or <a href="/signup" class="text-brand-primary hover:underline font-medium">create a new organisation</a>.
                </div>

            </form>
        </section>

        <!-- Brand Footer -->
        <footer class="text-center text-xs text-slate-400 dark:text-slate-500">
            Powered by <strong class="text-slate-600 dark:text-slate-300 font-semibold">Shofar Automation</strong>
        </footer>

    </main>
    <script>
    function togglePasswordVisibility(btn) {
        const input = document.getElementById('password');
        if (!input) return;
    
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = 'Hide';
        } else {
            input.type = 'password';
            btn.textContent = 'Show';
        }
    }
    </script>
</body>
</html>
