<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 dark:bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kryx{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <link rel="stylesheet" href="/static/admin-theme.css">
  {% block head %}{% endblock %}
</head>
<body class="h-full text-slate-800 dark:text-slate-100 font-sans antialiased flex flex-col min-h-screen">

  <!-- Global Header Navigation -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Brand / Logo -->
        <div class="flex items-center gap-8">
          <a href="/dashboard" class="flex items-center gap-2 font-bold text-lg text-cyan-600 dark:text-cyan-400">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12c0 1.82.49 3.53 1.35 5L2 22l5.1-1.32C8.54 21.51 10.22 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/>
            </svg>
            <span>Shofar<span class="text-slate-500 font-normal dark:text-slate-400">WhatsApp</span></span>
          </a>

          <!-- Main Nav Links -->
          <nav class="hidden md:flex items-center space-x-1">
            <a href="/dashboard" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition">
              Dashboard
            </a>
            <a href="/campaigns" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition">
              Campaigns
            </a>
            <a href="/templates" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition">
              Templates
            </a>
            <a href="/automations" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition">
              Automations
            </a>
            <a href="/admin" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition text-slate-500 dark:text-slate-400">
              Database Admin
            </a>
          </nav>
        </div>

        <!-- Quick Action / Status Badge -->
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            System Online
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Dynamic View Content -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
