<!-- Shared <style> block for the bespoke "*_list.html" pages (Units,
     Users, WhatsApp Numbers) - form-card container, sortable/filterable
     table, status pills and toolbar inputs, all themed for light/dark.
     Include with `{% set table_prefix = "units" %}` (or "users"/"numbers")
     set beforehand, matching that page's own `<table class="{{ table_prefix }}-table">`
     and `<div class="{{ table_prefix }}-toolbar">` classes. -->
<style>

  .form-card-container {
    background-color: var(--color-white);
    border: 1px solid var(--slate-200);
    color: var(--slate-900);
  }
  html.dark .form-card-container,
  [data-bs-theme="dark"] .form-card-container {
    background-color: var(--slate-800) !important;
    border-color: var(--slate-700) !important;
    color: var(--slate-100) !important;
  }

  table.{{ table_prefix }}-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.{{ table_prefix }}-table th {
    text-align: left; color: var(--slate-600); font-weight: 600; text-transform: uppercase;
    font-size: 0.7rem; letter-spacing: 0.03em; padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--slate-200);
  }
  html.dark table.{{ table_prefix }}-table th,
  [data-bs-theme="dark"] table.{{ table_prefix }}-table th {
    color: var(--slate-400) !important; border-bottom-color: var(--slate-700) !important;
  }
  table.{{ table_prefix }}-table td {
    padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--slate-200);
    color: var(--slate-700); vertical-align: middle;
  }
  html.dark table.{{ table_prefix }}-table td,
  [data-bs-theme="dark"] table.{{ table_prefix }}-table td {
    border-bottom-color: var(--slate-700) !important; color: var(--slate-100) !important;
  }
  table.{{ table_prefix }}-table tbody tr:hover { background-color: var(--slate-50); }
  html.dark table.{{ table_prefix }}-table tbody tr:hover,
  [data-bs-theme="dark"] table.{{ table_prefix }}-table tbody tr:hover { background-color: var(--slate-900) !important; }

  .status-pill { font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; }
  .status-pill.active { background-color: rgba(var(--brand-primary-rgb), 0.15); color: var(--brand-primary-hover); }
  .status-pill.inactive { background-color: rgba(var(--slate-400-rgb), 0.2); color: var(--slate-500); }
  .badge-pill { font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; background-color: rgba(var(--slate-400-rgb), 0.2); color: var(--slate-600); }
  html.dark .badge-pill,
  [data-bs-theme="dark"] .badge-pill { color: var(--slate-300) !important; }

  table.{{ table_prefix }}-table th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  table.{{ table_prefix }}-table th.sortable:hover { color: var(--brand-primary); }
  table.{{ table_prefix }}-table th.sortable .sort-arrow { display: inline-block; width: 0.9em; opacity: 0.35; }
  table.{{ table_prefix }}-table th.sortable.sort-asc .sort-arrow,
  table.{{ table_prefix }}-table th.sortable.sort-desc .sort-arrow { opacity: 1; }

  .{{ table_prefix }}-toolbar input[type="text"], .{{ table_prefix }}-toolbar select {
    background-color: var(--color-white); border: 1px solid var(--slate-300); color: var(--slate-900);
    border-radius: 0.5rem; padding: 0.5rem 0.75rem; font-size: 0.8rem;
  }
  html.dark .{{ table_prefix }}-toolbar input[type="text"], html.dark .{{ table_prefix }}-toolbar select,
  [data-bs-theme="dark"] .{{ table_prefix }}-toolbar input[type="text"], [data-bs-theme="dark"] .{{ table_prefix }}-toolbar select {
    background-color: var(--slate-900) !important; border-color: var(--slate-700) !important; color: var(--slate-100) !important;
  }

  .tw-btn-primary {
    background-color: var(--brand-primary) !important;
    color: var(--color-white) !important;
    border: none !important;
  }
  .tw-btn-primary:hover {
    background-color: var(--brand-primary-hover) !important;
    color: var(--color-white) !important;
  }
</style>
