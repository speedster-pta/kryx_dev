<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100 dark:bg-slate-900">
<head>
    <script>
    (function() {
      function applySystemTheme(e) {
        const isDark = e ? e.matches : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-bs-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      }
      applySystemTheme();
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
    })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kryx create account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>

    <style>
      :root {
        --brand-primary: #06B6D4;
        --brand-primary-rgb: 6, 182, 212;
        --brand-primary-hover: #0891B2;
      }
      .bg-brand-primary { background-color: var(--brand-primary); }
      .bg-brand-primary:hover { background-color: var(--brand-primary-hover); }
      .text-brand-primary { color: var(--brand-primary); }
      .shadow-brand { box-shadow: 0 10px 15px -3px rgba(var(--brand-primary-rgb), 0.25); }
      .focus-brand:focus {
        outline: none;
        border-color: var(--brand-primary) !important;
        box-shadow: 0 0 0 3px rgba(var(--brand-primary-rgb), 0.25) !important;
      }
    </style>
</head>

<body class="h-full flex flex-col items-center justify-center p-4 text-slate-800 dark:text-slate-100 font-sans antialiased bg-slate-100 dark:bg-slate-900 transition-colors duration-200">

    <main class="w-full max-w-md space-y-6">

        <section class="text-center space-y-3">
            <img src="/static/logo_web.png" alt="Shofar" class="h-40 w-auto mx-auto drop-shadow-sm">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Create Your Organisation</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">
                Sets up a brand-new organisation with you as its admin.
            </p>
        </section>

        <section class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm border-t-4" style="border-top-color: var(--brand-primary);">

            <form class="space-y-5" method="post" action="/signup">

                <div class="border-b border-slate-100 dark:border-slate-700/60 pb-3 flex items-center justify-between">
                    <h2 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-building text-brand-primary"></i> New Organisation
                    </h2>
                </div>

                {% if error %}
                <div class="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900/60 text-rose-700 dark:text-rose-300 p-3 rounded-lg text-xs flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation shrink-0"></i>
                    <div>{{ error }}</div>
                </div>
                {% endif %}

                <div>
                    <label for="org_name" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">
                        Organisation Name
                    </label>
                    <input id="org_name" type="text" name="org_name" placeholder="e.g. Acme Youth Network" autofocus required
                        class="focus-brand w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">
                </div>

                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">
                        Your Username
                    </label>
                    <input id="username" type="text" name="username" placeholder="Choose a username" autocomplete="username" required
                        class="focus-brand w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">
                        Password
                    </label>
                    <input id="password" type="password" name="password" placeholder="Choose a password" autocomplete="new-password" required
                        class="focus-brand w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">
                </div>

                <div>
                    <label for="confirm_password" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1.5">
                        Confirm Password
                    </label>
                    <input id="confirm_password" type="password" name="confirm_password" placeholder="Re-enter your password" autocomplete="new-password" required
                        class="focus-brand w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 outline-none transition">
                </div>

                <button type="submit"
                    class="w-full bg-brand-primary text-white font-semibold py-3 px-4 rounded-xl transition duration-150 flex items-center justify-center gap-2 shadow-brand active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-offset-2"
                    style="--tw-ring-color: var(--brand-primary);">
                    Create Organisation <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>

                <div class="pt-2 text-center text-xs text-slate-500 dark:text-slate-400">
                    Already have an account? <a href="/login" class="text-brand-primary font-medium">Sign in</a>
                </div>

            </form>
        </section>

        <footer class="text-center text-xs text-slate-400 dark:text-slate-500">
            Powered by <strong class="text-slate-600 dark:text-slate-300 font-semibold">Shofar Automation</strong>
        </footer>

    </main>
</body>
</html>
