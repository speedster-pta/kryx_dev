{% extends "sqladmin/layout.html" %}

{% block content %}
<div class="min-h-[65vh] flex flex-col items-center justify-center text-center px-4">
  <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-8 sm:p-12 max-w-md w-full shadow-2xl">

    <!-- Visual Icon -->
    <div class="mx-auto flex items-center justify-center w-20 h-20 rounded-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 mb-6">
      <i class="fa-solid fa-compass-drafting text-4xl" style="color: #06B6D4;"></i>
    </div>

    <!-- Error Code & Title -->
    <h1 class="text-6xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-2">404</h1>
    <h2 class="text-xl font-semibold text-slate-700 dark:text-slate-200 mb-3">Page Not Found</h2>

    <!-- Description -->
    <p class="text-slate-500 dark:text-slate-400 text-sm mb-8 leading-relaxed">
      Sorry, we couldn't find the page you're looking for. It might have been moved, deleted, or the URL might be mistyped.
    </p>

    <!-- Navigation Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="/campaigns" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium text-white rounded-lg transition hover:opacity-90 shadow-md" style="background-color: #06B6D4;">
        <i class="fa-solid fa-house"></i> Go to Dashboard
      </a>
      <button onclick="history.back()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg transition">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
    </div>

  </div>
</div>
{% endblock %}
