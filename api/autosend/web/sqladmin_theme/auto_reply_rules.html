{% extends "sqladmin/layout.html" %}

{% block head %}{{ super() }}
<script src="/static/app.js"></script>
{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="flex items-start gap-3 mb-1">
    <div class="min-w-0 flex-1">
      <h1 class="text-2xl font-bold">Auto-Reply Rules</h1>
      <p class="text-sm text-slate-500 mt-1">
        Exact-match keyword replies for the Inbox - independent of the AI Assistant, works
        even if it's off for this number.
      </p>
    </div>
    <button id="new-rule-btn" class="shrink-0 px-4 py-2 rounded-lg bg-brand-primary text-white text-sm font-medium hover:opacity-90 transition">
      + New Rule
    </button>
  </div>

  <div class="my-4">
    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">WhatsApp Number</label>
    <select id="number-select" class="w-full sm:w-80 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 p-2.5 focus-brand">
      <option value="">Loading…</option>
    </select>
  </div>

  <div id="rules-list" class="space-y-2"></div>

  <div id="rule-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-lg shadow-xl w-full max-w-md p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 id="rule-modal-title" class="text-lg font-semibold">New Rule</h2>
        <button id="close-rule-modal" class="text-slate-400 hover:text-slate-600">&times;</button>
      </div>
      <input type="hidden" id="rule-id">
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Keyword (exact match)</label>
          <input id="rule-keyword" type="text" placeholder="e.g. hours" class="w-full text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 p-2.5 focus-brand">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Response</label>
          <textarea id="rule-response" rows="4" class="w-full text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 p-2.5 focus-brand"></textarea>
        </div>
        <label class="flex items-center gap-2">
          <input type="checkbox" id="rule-active" checked class="rounded">
          <span class="text-sm">Active</span>
        </label>
      </div>
      <p id="rule-modal-error" class="text-xs text-red-500 mt-3 hidden"></p>
      <button id="save-rule" class="w-full mt-4 px-4 py-2 rounded-lg bg-brand-primary text-white text-sm font-medium hover:opacity-90 transition">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
    const numberSelect = document.getElementById('number-select');
    const rulesList = document.getElementById('rules-list');
    const newRuleBtn = document.getElementById('new-rule-btn');
    const ruleModal = document.getElementById('rule-modal');
    const closeRuleModal = document.getElementById('close-rule-modal');
    const ruleModalTitle = document.getElementById('rule-modal-title');
    const ruleIdInput = document.getElementById('rule-id');
    const ruleKeyword = document.getElementById('rule-keyword');
    const ruleResponse = document.getElementById('rule-response');
    const ruleActive = document.getElementById('rule-active');
    const ruleModalError = document.getElementById('rule-modal-error');

    async function loadNumbers() {
        const res = await fetch('/api/numbers');
        const numbers = res.ok ? await res.json() : [];
        numberSelect.innerHTML = numbers.map(n => `<option value="${n.id}">${WAPreview.escapeHtml(n.label)}</option>`).join('')
            || '<option value="">No WhatsApp numbers available</option>';
        if (numbers.length) loadRules(numbers[0].id);
    }

    async function loadRules(numberId) {
        const res = await fetch(`/api/ai-settings/${numberId}/rules`);
        const rules = res.ok ? await res.json() : [];
        if (!rules.length) {
            rulesList.innerHTML = '<p class="text-sm text-slate-400">No rules yet.</p>';
            return;
        }
        rulesList.innerHTML = rules.map(r => `
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-3.5 flex items-start justify-between gap-3">
                <div class="min-w-0">
                    <div class="font-mono text-sm font-semibold">${WAPreview.escapeHtml(r.keyword)}${!r.active ? ' <span class="text-xs text-slate-400 font-sans">(inactive)</span>' : ''}</div>
                    <div class="text-sm text-slate-600 dark:text-slate-300 mt-1 whitespace-pre-wrap">${WAPreview.escapeHtml(r.response_text)}</div>
                </div>
                <div class="flex-shrink-0 flex gap-2">
                    <button class="edit-rule-btn text-xs text-slate-500 hover:text-slate-700 dark:hover:text-slate-300" data-id="${r.id}">Edit</button>
                    <button class="delete-rule-btn text-xs text-red-500 hover:text-red-700" data-id="${r.id}">Delete</button>
                </div>
            </div>
        `).join('');

        rulesList.querySelectorAll('.edit-rule-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const rule = rules.find(r => r.id === parseInt(btn.dataset.id, 10));
                openModal(rule);
            });
        });
        rulesList.querySelectorAll('.delete-rule-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (!confirm('Delete this rule?')) return;
                await fetch(`/api/ai-settings/${numberSelect.value}/rules/${btn.dataset.id}`, { method: 'DELETE' });
                loadRules(numberSelect.value);
            });
        });
    }

    function openModal(rule) {
        ruleModalError.classList.add('hidden');
        if (rule) {
            ruleModalTitle.textContent = 'Edit Rule';
            ruleIdInput.value = rule.id;
            ruleKeyword.value = rule.keyword;
            ruleResponse.value = rule.response_text;
            ruleActive.checked = !!rule.active;
        } else {
            ruleModalTitle.textContent = 'New Rule';
            ruleIdInput.value = '';
            ruleKeyword.value = '';
            ruleResponse.value = '';
            ruleActive.checked = true;
        }
        ruleModal.classList.remove('hidden');
    }

    numberSelect.addEventListener('change', () => {
        if (numberSelect.value) loadRules(numberSelect.value);
    });
    newRuleBtn.addEventListener('click', () => openModal(null));
    closeRuleModal.addEventListener('click', () => ruleModal.classList.add('hidden'));

    document.getElementById('save-rule').addEventListener('click', async () => {
        const keyword = ruleKeyword.value.trim();
        const responseText = ruleResponse.value.trim();
        if (!keyword || !responseText) {
            ruleModalError.textContent = 'Keyword and response are required.';
            ruleModalError.classList.remove('hidden');
            return;
        }
        const payload = { keyword, response_text: responseText, active: ruleActive.checked };
        const isEdit = !!ruleIdInput.value;
        const url = isEdit
            ? `/api/ai-settings/${numberSelect.value}/rules/${ruleIdInput.value}`
            : `/api/ai-settings/${numberSelect.value}/rules`;
        const res = await fetch(url, {
            method: isEdit ? 'PATCH' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        if (!res.ok) {
            ruleModalError.textContent = (await res.json().catch(() => ({}))).detail || 'Failed to save.';
            ruleModalError.classList.remove('hidden');
            return;
        }
        ruleModal.classList.add('hidden');
        loadRules(numberSelect.value);
    });

    loadNumbers();
})();
</script>
{% endblock %}
